<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F3F8" />
      <stop offset="100%" stop-color="#E2E4EC" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555874" />
      <stop offset="100%" stop-color="#3D4058" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2E4A" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <rect width="200" height="200" fill="url(#bgGrad)" />
  
  <g filter="url(#softGlow)">
    <!-- Hijab Head & Crown Silhouette -->
    <!-- Outer Hijab wrap contour covering head, chest, and shoulders -->
    <path d="M100 28 C74 28, 58 46, 56 74 C54 94, 60 114, 52 135 C44 154, 25 168, 12 186 C28 198, 62 204, 100 204 C138 204, 172 198, 188 186 C175 168, 156 154, 148 135 C140 114, 146 94, 144 74 C142 46, 126 28, 100 28 Z" fill="url(#shadowGrad)" />
    
    <!-- Face oval opening contour (delicate subtle contrast) -->
    <path d="M100 50 C83 50, 74 65, 74 84 C74 103, 85 118, 100 120 C115 118, 126 103, 126 84 C126 65, 117 50, 100 50 Z" fill="#EAEAF2" opacity="0.9" />
    
    <!-- Inner face subtle shadow silhouette -->
    <path d="M100 54 C85 54, 78 68, 78 85 C78 101, 88 114, 100 116 C112 114, 122 101, 122 85 C122 68, 115 54, 100 54 Z" fill="#D3D5E2" />

    <!-- Delicate Hijab Drape Fold Line Details -->
    <path d="M82 124 C92 136, 108 136, 118 124 C128 138, 144 148, 160 156 C142 165, 122 170, 100 170 C78 170, 58 165, 40 156 C56 148, 72 138, 82 124 Z" fill="#363950" opacity="0.35" />
    <path d="M68 145 C82 158, 118 158, 132 145 C146 160, 164 172, 180 182 C158 196, 130 202, 100 202 C70 202, 42 196, 20 182 C36 172, 54 160, 68 145 Z" fill="#2E3146" opacity="0.25" />
  </g>
</svg>
